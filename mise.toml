# Tool versions for this repo. Run `mise install`, or `just setup` for everything.
# Quarto is not managed here: mise has no registry entry for it. It is only needed
# for the legacy Quarto build (`just build`), so `just setup` checks for it and says
# what is missing.
[tools]
# Astro 7 needs Node >=22.23.4. Stay on the 24 line.
node = "24"
# Python is left to uv, which reads requires-python from pyproject.toml and fetches
# a matching interpreter itself.
uv = "0.11"
just = "1.58"

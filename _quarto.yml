project:
  type: website
  output-dir: docs
  # Referenced from an <iframe src> in posts/examples, which Quarto can't
  # auto-detect as a dependency, so it must be declared explicitly.
  resources:
    - assets/test/geojson_layer.html
  # Explicit list so stray top-level markdown (e.g. TRASH-FILES.md, README.md)
  # is not turned into a published page.
  render:
    - "*.qmd"
    - "LICENSE.md"
    - "posts/"

website:
  title: "The Bear's Toes"
  site-url: https://bear-toes.pages.dev/
  favicon: icon/profile-circle.png
  page-navigation: true
  open-graph: true
  reader-mode: true
  google-analytics:
    tracking-id: G-RTR8YLS84R
    storage: cookies
    anonymize-ip: true
  cookie-consent: implied
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - text: About
        href: about.qmd
      - text: Blog
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/rtedwards
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/robert-edwards-3b98865/
        aria-label: Linkedin
      - icon: rss
        href: index.xml
        aria-label: RSS
  page-footer:
    center:
      - text: "About"
        href: about.qmd
      - text: "License"
        href: LICENSE.md
      # - text: "Trademark"
      #   href: trademark.qmd
      # - text: ☕️
      # href: coffee.qmd
format:
  html:
    theme:
      dark: css/dark.scss
      light: css/light.scss

highlight-style: atom-one #github #gruvbox #breeze

project:
  type: website
  output-dir: docs
  # Referenced from an <iframe src> in posts/examples, which Quarto can't
  # auto-detect as a dependency, so it must be declared explicitly.
  resources:
    - assets/test/geojson_layer.html
  # Explicit list so stray top-level markdown (e.g. TRASH-FILES.md, README.md)
  # is not turned into a published page.
  render:
    - "*.qmd"
    - "LICENSE.md"
    - "posts/"

website:
  title: "The Bear's Toes"
  site-url: https://bear-toes.pages.dev/
  favicon: icon/profile-circle.png
  page-navigation: true
  open-graph: true
  reader-mode: true
  # Analytics is Cloudflare Web Analytics, injected via format.html
  # include-after-body below. It sets no cookies, so no consent banner is
  # needed and google-analytics/cookie-consent are deliberately absent.
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - text: About
        href: about.qmd
      - text: Blog
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/rtedwards
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/robert-edwards-3b98865/
        aria-label: Linkedin
      - icon: rss
        href: index.xml
        aria-label: RSS
  page-footer:
    center:
      - text: "About"
        href: about.qmd
      - text: "License"
        href: LICENSE.md
      # - text: "Trademark"
      #   href: trademark.qmd
      # - text: ☕️
      # href: coffee.qmd
format:
  html:
    theme:
      dark: css/dark.scss
      light: css/light.scss
    # Cloudflare Web Analytics. Pages is documented as offering a one-click
    # toggle under the project's Metrics tab, but that control is absent from
    # the dashboard (cloudflare/cloudflare-docs#17187), so the beacon is
    # installed by hand. The token is a public site identifier, not a secret.
    # Only one such snippet may render per page.
    include-after-body:
      text: |
        <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1a257cb2a13c4b63a087d96bc4d89131"}'></script><!-- End Cloudflare Web Analytics -->

highlight-style: atom-one #github #gruvbox #breeze

[project]
name = "rtedwards-github-io"
version = "0.1.0"
description = "Blog"
authors = [{name = "Robert Edwards"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.21",
    "jupyter>=1.1.1",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "altair>=5.5",
    "pandas>=2.2",
    "pyarrow>=19.0",
    "pydeck>=0.9",
    "scikit-learn>=1.6",
    "vega-datasets>=0.9.0",
    "tqdm>=4.67",
    "ipywidgets>=8.1",
    "tabulate>=0.9",
    "polars>=1.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pylint>=3.3",
    "mypy>=1.15",
]

[tool.hatch.build.targets.wheel]
packages = []
